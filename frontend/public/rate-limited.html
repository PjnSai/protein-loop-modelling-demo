<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Too Many Requests</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f8f9fa;
        color: #212529;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 16px;
      }
      main {
        max-width: 420px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Too many requests</h1>
      <p>
        This demo limits how often each visitor can load it. Please wait a
        minute, then refresh the page.
      </p>
    </main>
  </body>
</html>
